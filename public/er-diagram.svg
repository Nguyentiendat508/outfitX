<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .table { fill:#0b1220; stroke:#7aa2ff; stroke-width:1.5; rx:8; ry:8; }
      .title { fill:#0b1220; }
      .title-text { fill:#7aa2ff; font-weight:700; font-size:16px; }
      .row-text { fill:#e6edf3; font-size:13px; }
      .line { stroke:#8be9fd; stroke-width:1.5; marker-end:url(#arrow); }
      .note { fill:#99a3b3; font-size:12px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8be9fd"/>
    </marker>
  </defs>

  <!-- Tables -->
  <!-- Categories -->
  <rect class="table" x="70" y="70" width="250" height="140"/>
  <rect class="title" x="70" y="70" width="250" height="32" fill="#0b1220"/>
  <text class="title-text" x="85" y="92">Categories</text>
  <g>
    <text class="row-text" x="85" y="120">id (PK)</text>
    <text class="row-text" x="85" y="140">name</text>
    <text class="row-text" x="85" y="160">description</text>
  </g>

  <!-- CategoryTypes -->
  <rect class="table" x="380" y="70" width="270" height="160"/>
  <rect class="title" x="380" y="70" width="270" height="32" fill="#0b1220"/>
  <text class="title-text" x="395" y="92">CategoryTypes</text>
  <g>
    <text class="row-text" x="395" y="120">id (PK)</text>
    <text class="row-text" x="395" y="140">name</text>
    <text class="row-text" x="395" y="160">description</text>
    <text class="row-text" x="395" y="180">id_category (FK)</text>
  </g>

  <!-- Products -->
  <rect class="table" x="720" y="40" width="300" height="220"/>
  <rect class="title" x="720" y="40" width="300" height="32" fill="#0b1220"/>
  <text class="title-text" x="735" y="62">Products</text>
  <g>
    <text class="row-text" x="735" y="90">id (PK)</text>
    <text class="row-text" x="735" y="110">name, price</text>
    <text class="row-text" x="735" y="130">description, size, color</text>
    <text class="row-text" x="735" y="150">stock, voucher</text>
    <text class="row-text" x="735" y="170">id_cate_type (FK)</text>
    <text class="row-text" x="735" y="190">listImg, discount</text>
  </g>

  <!-- Users -->
  <rect class="table" x="70" y="270" width="280" height="200"/>
  <rect class="title" x="70" y="270" width="280" height="32" fill="#0b1220"/>
  <text class="title-text" x="85" y="292">Users</text>
  <g>
    <text class="row-text" x="85" y="320">id (PK), name, email (UNQ)</text>
    <text class="row-text" x="85" y="340">password, phone</text>
    <text class="row-text" x="85" y="360">address, role</text>
  </g>

  <!-- Orders -->
  <rect class="table" x="390" y="300" width="300" height="220"/>
  <rect class="title" x="390" y="300" width="300" height="32" fill="#0b1220"/>
  <text class="title-text" x="405" y="322">Orders</text>
  <g>
    <text class="row-text" x="405" y="350">id (PK), order_date, status</text>
    <text class="row-text" x="405" y="370">total_amount, shipping_info</text>
    <text class="row-text" x="405" y="390">created_at, update_at</text>
    <text class="row-text" x="405" y="410">id_user (FK)</text>
  </g>

  <!-- OrderItems -->
  <rect class="table" x="750" y="320" width="280" height="180"/>
  <rect class="title" x="750" y="320" width="280" height="32" fill="#0b1220"/>
  <text class="title-text" x="765" y="342">OrderItems</text>
  <g>
    <text class="row-text" x="765" y="370">id (PK)</text>
    <text class="row-text" x="765" y="390">order_id (FK), product_id (FK)</text>
    <text class="row-text" x="765" y="410">quantity, price</text>
  </g>

  <!-- CartItems -->
  <rect class="table" x="1080" y="330" width="260" height="160"/>
  <rect class="title" x="1080" y="330" width="260" height="32" fill="#0b1220"/>
  <text class="title-text" x="1095" y="352">CartItems</text>
  <g>
    <text class="row-text" x="1095" y="380">id (PK)</text>
    <text class="row-text" x="1095" y="400">product_id (FK)</text>
    <text class="row-text" x="1095" y="420">quantity, price</text>
  </g>

  <!-- Payments -->
  <rect class="table" x="1110" y="70" width="260" height="160"/>
  <rect class="title" x="1110" y="70" width="260" height="32" fill="#0b1220"/>
  <text class="title-text" x="1125" y="92">Payments</text>
  <g>
    <text class="row-text" x="1125" y="120">id (PK), order_id (FK)</text>
    <text class="row-text" x="1125" y="140">payment_method</text>
    <text class="row-text" x="1125" y="160">amount, status</text>
  </g>

  <!-- Blog_post -->
  <rect class="table" x="70" y="520" width="300" height="220"/>
  <rect class="title" x="70" y="520" width="300" height="32" fill="#0b1220"/>
  <text class="title-text" x="85" y="542">Blog_post</text>
  <g>
    <text class="row-text" x="85" y="570">id (PK), title, image</text>
    <text class="row-text" x="85" y="590">status, isDelete</text>
    <text class="row-text" x="85" y="610">content</text>
    <text class="row-text" x="85" y="630">created_at, updated_at</text>
  </g>

  <!-- Contact -->
  <rect class="table" x="420" y="560" width="250" height="160"/>
  <rect class="title" x="420" y="560" width="250" height="32" fill="#0b1220"/>
  <text class="title-text" x="435" y="582">Contact</text>
  <g>
    <text class="row-text" x="435" y="610">id (PK), name, email</text>
    <text class="row-text" x="435" y="630">message, user_id (FK)</text>
  </g>

  <!-- Review -->
  <rect class="table" x="710" y="560" width="250" height="160"/>
  <rect class="title" x="710" y="560" width="250" height="32" fill="#0b1220"/>
  <text class="title-text" x="725" y="582">Review</text>
  <g>
    <text class="row-text" x="725" y="610">id (PK), name</text>
    <text class="row-text" x="725" y="630">message, user_id (FK)</text>
  </g>

  <!-- Relations -->
  <!-- CategoryTypes -> Categories -->
  <line class="line" x1="380" y1="150" x2="320" y2="150"/>
  <text class="note" x="330" y="140">N:1</text>

  <!-- Products -> CategoryTypes -->
  <line class="line" x1="720" y1="150" x2="650" y2="150"/>
  <text class="note" x="655" y="140">N:1</text>

  <!-- Orders -> Users -->
  <line class="line" x1="390" y1="410" x2="350" y2="370"/>
  <text class="note" x="345" y="390">N:1</text>

  <!-- OrderItems -> Orders -->
  <line class="line" x1="750" y1="360" x2="690" y2="360"/>
  <text class="note" x="700" y="350">N:1</text>

  <!-- OrderItems -> Products -->
  <line class="line" x1="820" y1="320" x2="870" y2="260"/>
  <text class="note" x="845" y="290">N:1</text>

  <!-- CartItems -> Products -->
  <line class="line" x1="1130" y1="330" x2="1020" y2="250"/>
  <text class="note" x="1050" y="290">N:1</text>

  <!-- Payments -> Orders -->
  <line class="line" x1="1160" y1="230" x2="960" y2="330"/>
  <text class="note" x="1040" y="285">N:1</text>

  <!-- Contact -> Users -->
  <line class="line" x1="420" y1="630" x2="350" y2="580"/>
  <text class="note" x="355" y="600">N:1</text>

  <!-- Review -> Users -->
  <line class="line" x1="710" y1="630" x2="350" y2="580"/>
  <text class="note" x="520" y="600">N:1</text>

  <text class="note" x="50" y="970">Notes: PK = Primary Key, FK = Foreign Key, N:1 = many-to-one</text>
</svg>



